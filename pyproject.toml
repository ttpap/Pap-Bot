[project]
name = "btc-bot"
version = "0.1.0"
description = "BTC trading bot for Binance + Mercado Bitcoin with confluence indicators, ATR risk management, and AI news filtering"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "ttpap" }]

dependencies = [
    # Exchange APIs
    "ccxt>=4.4.0",
    "httpx>=0.27.0",
    # Data + indicators
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "pandas-ta>=0.3.14b",
    # Async + scheduling
    "anyio>=4.4.0",
    "apscheduler>=3.10.4",
    # Persistence
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "redis>=5.0.0",
    # Config
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.0",
    # API server (for panel)
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    # Logging
    "structlog>=24.1.0",
    # AI / news
    "anthropic>=0.30.0",
    "feedparser>=6.0.0",
    # CLI
    "typer>=0.12.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "ipython>=8.24.0",
]

[project.scripts]
btc-bot = "btc_bot.__main__:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/btc_bot"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["src/tests"]
